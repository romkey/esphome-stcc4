# Example ESPHome configuration for STCC4 CO2 sensor

esphome:
  name: stcc4-sensor
  friendly_name: STCC4 CO2 Sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

# Enable logging
logger:

# Enable Home Assistant API
api:

ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

# I2C Bus Configuration
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true
  id: bus_a

# STCC4 Component
stcc4:
  update_interval: 60s  # Update every 60 seconds
  
sensor:
  - platform: stcc4
    co2:
      name: "CO2 Concentration"
      id: co2_concentration
    temperature:
      name: "Temperature"
      id: temperature
    humidity:
      name: "Relative Humidity"
      id: humidity
    # Optional: Pressure compensation in Pascals (default: 101325 Pa)
    # pressure_compensation: 101325
    # Optional: Altitude compensation in meters (automatically calculates pressure)
    # altitude_compensation: 500

