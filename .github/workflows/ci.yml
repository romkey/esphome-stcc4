name: CI

on:
  push:
    branches: [main]
    paths:
      - ".ci/**"
      - ".github/workflows/ci.yml"
      - "components/**"
      - "examples/**"
  pull_request:
    branches: [main]
    paths:
      - ".ci/**"
      - ".github/workflows/ci.yml"
      - "components/**"
      - "examples/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLATFORMIO_CORE_DIR: ~/.platformio

jobs:
  lint:
    name: Validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - .ci/build.yaml
          - .ci/lint-minimal.yaml
          - .ci/lint-with-secrets.yaml
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .ci/requirements.txt

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-esphome-${{ hashFiles('.ci/requirements.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-esphome-

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install -r .ci/requirements.txt

      - name: Prepare CI secrets
        run: cp .ci/secrets.ci.yaml .ci/secrets.yaml

      - name: Validate ESPHome configuration
        run: esphome config "${{ matrix.config }}"

      - name: Run CRC-8 unit test
        run: python .ci/test_crc.py
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .ci/requirements.txt

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-esphome-${{ hashFiles('.ci/requirements.txt', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pip-esphome-

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-stcc4-${{ hashFiles('.ci/build.yaml', 'components/stcc4/**', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-pio-stcc4-

      - name: Cache ESPHome build artifacts
        uses: actions/cache@v4
        with:
          path: .ci/.esphome
          key: ${{ runner.os }}-esphome-build-${{ hashFiles('.ci/build.yaml', 'components/stcc4/**') }}
          restore-keys: |
            ${{ runner.os }}-esphome-build-

      - name: Install ESPHome
        run: |
          python -m pip install --upgrade pip
          pip install -r .ci/requirements.txt

      - name: Compile firmware
        run: esphome compile .ci/build.yaml
