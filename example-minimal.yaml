# Minimal ESPHome configuration for STCC4 CO2 sensor

esphome:
  name: stcc4-minimal
  friendly_name: STCC4 Minimal

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

# I2C Bus
i2c:
  sda: GPIO21
  scl: GPIO22

# STCC4 Component - minimal configuration
stcc4:

sensor:
  - platform: stcc4
    co2:
      name: "CO2"
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"

