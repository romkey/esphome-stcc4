# Local ESPHome development for this component repository.
#
# Validate a config:
#   docker compose run --rm esphome config examples/local-example.yaml
#
# Compile firmware (uses the local components/ tree):
#   docker compose run --rm esphome compile examples/local-example.yaml
#
# Compile any example:
#   docker compose run --rm esphome compile examples/example-minimal.yaml
#
# Upload to a device over USB (requires host passthrough):
#   docker compose run --rm esphome run examples/local.yaml
#
# Copy examples/local-example.yaml to examples/local.yaml for a personal config
# with Wi-Fi and other secrets (local*.yaml is gitignored).

services:
  esphome:
    image: ghcr.io/esphome/esphome:stable
    volumes:
      - .:/config
      - platformio:/root/.platformio
    environment:
      PLATFORMIO_CORE_DIR: /root/.platformio
    network_mode: host
    privileged: true
    stdin_open: true
    tty: true

volumes:
  platformio:
