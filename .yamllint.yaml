# Found automatically by yamllint; lints both .yaml and .yml files.
# ESPHome configs have long lambdas and entity names, so line-length is
# relaxed and document-start markers are not required.

extends: default

# Skip build output and secrets. Reuses .gitignore so the two can't drift.
ignore-from-file: .gitignore

rules:
  line-length:
    max: 120
  document-start: disable
  # GitHub workflows use `on:`, which YAML 1.1 reads as a boolean.
  truthy:
    check-keys: false
  comments-indentation: disable
