esphome:
  name: stcc4-test
  friendly_name: STCC4 Test

esp32:
  board: esp32thing_plus
  framework:
    type: esp-idf

external_components:
  - source:
      type: git
      url: https://github.com/romkey/esphome-stcc4
      ref: main
    components: [ stcc4 ]
 
logger:

api:

ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  scan: True

sensor:
  - platform: stcc4
    update_interval: 60s
    co2:
      name: "STCC4 CO2"
    temperature:
      name: "STCC4 Temperature"
    humidity:
      name: "STCC4 Relative Humidity"
  - platform: scd4x
    co2:
      name: "SCD40 CO2"
    temperature:
      name: "SCD40 Temperature"
    humidity:
      name: "SCD40 Humidity"
