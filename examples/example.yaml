esphome:
  name: stcc4-sensor
  friendly_name: STCC4 CO2 Sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/romkey/esphome-stcc4
      ref: main
    components: [ stcc4 ]
    
logger:

api:

ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  scan: true

sensor:
  - platform: stcc4
    address: 0x64
    update_interval: 60s
    co2:
      name: "CO2 ppm"
      id: co2_concentration
    temperature:
      name: "Temperature"
      id: temperature
    humidity:
      name: "Relative Humidity"
      id: humidity
    # Optional: Pressure compensation in Pascals (default: 101325 Pa)
    # pressure_compensation: 101325
    # Optional: Altitude compensation in meters (automatically calculates pressure)
    # altitude_compensation: 500

