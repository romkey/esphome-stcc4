# CI lint target mirroring examples/example.yaml with a local component path.
esphome:
  name: stcc4-sensor
  friendly_name: STCC4 CO2 Sensor

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ../components
    components: [stcc4]

logger:

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  scan: true

sensor:
  - platform: stcc4
    address: 0x64
    update_interval: 60s
    co2:
      name: "CO2 ppm"
      id: co2_concentration
    temperature:
      name: "Temperature"
      id: temperature
    humidity:
      name: "Relative Humidity"
      id: humidity
