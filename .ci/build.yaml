# CI compile target: minimal ESP32 config using the local component tree.
esphome:
  name: stcc4-ci
  friendly_name: STCC4 CI

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: ../components
    components: [stcc4]

logger:

i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: stcc4
    co2:
      name: "CO2"
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
